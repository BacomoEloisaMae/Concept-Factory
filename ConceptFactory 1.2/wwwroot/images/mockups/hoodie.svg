<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <g id="hoodie-body">
    <!-- Main body -->
    <path d="M125,85 L70,105 L30,185 L85,200 L85,375 L315,375 L315,200 L370,185 L330,105 L275,85
             C275,85 260,125 200,125 C140,125 125,85 125,85 Z"
          fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Left sleeve -->
    <path d="M125,85 L70,105 L30,185 L85,200 L108,125 Z"
          fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Right sleeve -->
    <path d="M275,85 L330,105 L370,185 L315,200 L292,125 Z"
          fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Hood -->
    <path d="M125,85 C130,55 155,35 200,33 C245,35 270,55 275,85 C255,70 240,60 200,58 C160,60 145,70 125,85 Z"
          fill="#282828" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Hood opening -->
    <ellipse cx="200" cy="78" rx="35" ry="22" fill="#1e1e1e" stroke="#111" stroke-width="1.5"/>
    <!-- Kangaroo pocket -->
    <path d="M155,280 Q200,270 245,280 L248,340 Q200,348 152,340 Z"
          fill="#282828" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Center zipper line -->
    <line x1="200" y1="125" x2="200" y2="280" stroke="#222" stroke-width="1.5" opacity="0.5"/>
    <!-- Fold lines -->
    <line x1="148" y1="200" x2="143" y2="370" stroke="#222" stroke-width="1" opacity="0.3"/>
    <line x1="252" y1="200" x2="257" y2="370" stroke="#222" stroke-width="1" opacity="0.3"/>
  </g>
  <rect id="print-area" x="152" y="148" width="96" height="100" fill="none" stroke="none"/>
</svg>
