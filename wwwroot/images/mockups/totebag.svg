<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <g id="totebag-body">
    <!-- Bag body -->
    <path d="M85,130 L75,370 L325,370 L315,130 Z"
          fill="#c8b89a" stroke="#a09070" stroke-width="2"/>
    <!-- Bag top fold -->
    <rect x="85" y="118" width="230" height="18" rx="2" fill="#b5a58a" stroke="#a09070" stroke-width="1.5"/>
    <!-- Left handle -->
    <path d="M130,118 C125,80 135,50 155,48 C175,46 178,75 175,118"
          fill="none" stroke="#8a7a62" stroke-width="8" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M270,118 C275,80 265,50 245,48 C225,46 222,75 225,118"
          fill="none" stroke="#8a7a62" stroke-width="8" stroke-linecap="round"/>
    <!-- Bag side shading -->
    <path d="M85,130 L75,370 L110,370 L118,130 Z" fill="#b5a58a" opacity="0.5"/>
    <path d="M315,130 L325,370 L290,370 L282,130 Z" fill="#b5a58a" opacity="0.5"/>
    <!-- Bottom fold -->
    <path d="M75,370 L325,370 L320,355 L80,355 Z" fill="#b5a58a" opacity="0.6"/>
    <!-- Subtle texture lines -->
    <line x1="200" y1="130" x2="197" y2="368" stroke="#a09070" stroke-width="0.5" opacity="0.4"/>
  </g>
  <rect id="print-area" x="148" y="165" width="104" height="130" fill="none" stroke="none"/>
</svg>
