<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <!-- T-Shirt shape -->
  <g id="tshirt-body">
    <!-- Main body -->
    <path d="M130,60 L80,80 L40,160 L90,175 L90,360 L310,360 L310,175 L360,160 L320,80 L270,60
             C270,60 255,95 200,95 C145,95 130,60 130,60 Z"
          fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Left sleeve -->
    <path d="M130,60 L80,80 L40,160 L90,175 L110,110 Z"
          fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Right sleeve -->
    <path d="M270,60 L320,80 L360,160 L310,175 L290,110 Z"
          fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Collar -->
    <path d="M130,60 C145,95 200,95 270,60 C255,50 240,45 200,45 C160,45 145,50 130,60 Z"
          fill="#252525" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Subtle fold lines -->
    <line x1="150" y1="180" x2="145" y2="355" stroke="#222" stroke-width="1" opacity="0.4"/>
    <line x1="250" y1="180" x2="255" y2="355" stroke="#222" stroke-width="1" opacity="0.4"/>
    <line x1="200" y1="95" x2="200" y2="355" stroke="#222" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Design print area (transparent – canvas will draw here) -->
  <rect id="print-area" x="148" y="130" width="104" height="110" fill="none" stroke="none"/>
</svg>
